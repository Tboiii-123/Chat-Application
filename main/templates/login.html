{% extends 'base.html' %}
{% load static %}



{% block navbar %}
{% include 'pop.html' %}
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center px-4 py-10">
  
  <div class="bg-white shadow-2xl rounded-2xl overflow-hidden max-w-5xl w-full grid grid-cols-1 md:grid-cols-2">
    
    <!-- Left side (Form) -->
    <div class="p-8 md:p-12 flex flex-col justify-center">
      <h1 class="text-3xl font-extrabold text-gray-900 mb-3">Chat App</h1>
      <p class="text-lg font-semibold text-gray-700 mb-6">Login</p>
      <p class="text-sm text-gray-500 mb-6">Login and chat with your fellow pals</p>

      <form method="POST" action="" class="space-y-5">
        {% csrf_token %}

        <input type="text" name="email" placeholder="Email" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <input type="password" name="password" placeholder="Password" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center space-x-2">
            <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
            <span class="text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-indigo-600 hover:underline">Forgot password?</a>
        </div>

        <button type="submit"
          class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg hover:bg-indigo-700 transition duration-200">
          Login
        </button>
      </form>

      <p class="text-sm text-gray-600 mt-6 text-center">
        Don’t have an account?
        <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
      </p>
    </div>

    <!-- Right side (Image) -->
    <div class="hidden md:flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-600 p-6">
      <img src="{% static 'img/chatty2.jpg' %}" alt="Chat Illustration" class="rounded-xl shadow-lg max-h-[450px] object-cover">
    </div>
  </div>
</div>
{% endblock %}
