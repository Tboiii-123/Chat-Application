{% extends 'base.html' %}
{% load static %}



{% block navbar %}
{% include 'pop.html'%}
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center px-4 py-10">
  
  <div class="bg-white shadow-2xl rounded-2xl overflow-hidden max-w-5xl w-full grid grid-cols-1 md:grid-cols-2">
    
    <!-- Left side (Form) -->
    <div class="p-8 md:p-12 flex flex-col justify-center">
      <h1 class="text-3xl font-extrabold text-gray-900 mb-3">Sign Up</h1>
      <p class="text-sm text-gray-500 mb-6">Let’s get you set up so you can access your personal account</p>

      <form method="POST" action="" class="space-y-5">
        {% csrf_token %}

        <!-- Username -->
        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <!-- First & Last Name -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">First Name</label>
            <input type="text" name="firstname" placeholder="John" required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Last Name</label>
            <input type="text" name="lastname" placeholder="Doe" required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- Email & Phone -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
            <input type="email" name="email" placeholder="JohnDoe@gmail.com" required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Phone Number</label>
            <input type="number" name="number" placeholder="09035014430" required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
          <input type="password" name="password1" placeholder="••••••" required
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Confirm Password</label>
          <input type="password" name="password2" placeholder="••••••" required
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Terms Checkbox -->
        <label class="flex items-center space-x-2 text-sm text-gray-600">
          <input type="checkbox" required class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
          <span>I agree to all the <a href="#" class="text-indigo-600 hover:underline">Terms</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policies</a></span>
        </label>

        <!-- Submit -->
        <button type="submit"
          class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg hover:bg-indigo-700 transition duration-200">
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <p class="text-sm text-gray-600 mt-6 text-center">
        Already have an account?
        <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Login</a>
      </p>
    </div>

    <!-- Right side (Image) -->
    <div class="hidden md:flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-600 p-6">
      <img src="{% static 'img/chatty2.jpg' %}" alt="Chat Illustration" class="rounded-xl shadow-lg max-h-[450px] object-cover">
    </div>
  </div>
</div>
{% endblock %}
